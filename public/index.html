.top{border-bottom:4px solid;border-image:linear-gradient(90deg,#0F766E,#2DD4BF,#C4A574) 1}
.brand{display:flex;align-items:center;gap:10px}
.brand small{font-family:Inter,Tajawal,sans-serif;font-weight:500;font-size:13px;opacity:.9;border-inline-start:1px solid rgba(255,255,255,.45);padding-inline-start:10px}
.lk{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 18px}
.lk .tag{color:var(--m);font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid #2DD4BF;border-color:var(--p)}
.top .u{display:flex;gap:8px;align-items:center;font-size:13px}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--p2);padding:6px 10px;position:sticky;top:0;z-index:5}
.nav button{background:none;border:0;color:#cbd5e1;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:500}
.nav button.on{background:#fff;color:var(--p2)}
.nav .cnt{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-inline-start:4px}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat small{color:var(--m)}.stat b{display:block;font-size:22px;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=text],.bar input[type=search]{max-width:260px}.bar input[type=date]{max-width:170px}
.b{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-block}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.pri{background:var(--p);color:#fff;border-color:var(--p)}
.b.del{color:var(--bad)}
.rem{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:14px}.rem input{width:auto;accent-color:#0F766E}
.lg{width:auto;padding:4px 8px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--t)}
.b.wa{display:inline-flex;align-items:center;justify-content:center;padding:5px 9px;line-height:1}
.b.present.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.b.late.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.b.absent.on{background:var(--bad);color:#fff;border-color:var(--bad)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--bd);font-size:14px}
th{background:#f8fafc;color:var(--m);font-weight:500;white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover{background:#f8fafc}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
.bd{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#e2e8f0}
.bd.ok{background:#dcfce7;color:#166534}.bd.bad{background:#fee2e2;color:#991b1b}.bd.warn{background:#fef3c7;color:#92400e}.bd.info{background:#dbeafe;color:#1e40af}
.sc{background:#fff;border:1px solid var(--bd);border-inline-start:5px solid var(--p);border-radius:12px;padding:12px;margin-bottom:10px}
.sc.code{border-inline-start-color:#6366f1}
.sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.sh .sp{flex:1}
.meta{color:var(--m);font-size:13px}
.ar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--bd)}
.ar.absent .an b{text-decoration:line-through;color:var(--m)}
.ar .rm{color:var(--bad);font-size:12px}
.ab{display:flex;gap:4px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:20}
.md{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:16px}
.md.wide{max-width:800px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{border:0;background:#f1f5f9;border-radius:8px;width:30px;height:30px;cursor:pointer}
.f{display:block;margin-bottom:10px}.f span{display:block;font-size:13px;color:var(--m);margin-bottom:3px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;border-bottom:1px solid var(--bd)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--m);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--p);border-bottom-color:var(--p);font-weight:700}
.al{padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:14px}
.al.warn{background:#fef3c7}.al.bad{background:#fee2e2}
.pick{max-height:180px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
.pick label{display:flex;gap:8px;align-items:center;padding:4px 0}
.pick input{width:auto}
.login{max-width:360px;margin:12vh auto;padding:0 14px}
.empty{text-align:center;color:var(--m);padding:24px}
h3{margin:4px 0 10px}
.nt{padding:10px;border-bottom:1px solid var(--bd)}.nt.un{background:#f0fdfa}
@media(max-width:600px){.wrap{padding:8px}th,td{padding:6px}}
</style>

const lbl=o=>new Proxy(o,{get:(o2,k)=>(typeof k==='string'&&Object.prototype.hasOwnProperty.call(o2,k))?_t(o2[k]):o2[k]});
const KEY='autoecole_db_v1';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d);};
const monthOf=s=>(s||'').slice(0,7);
const toMin=t=>{const p=t.split(':').map(Number);return p[0]*60+p[1];};
const LOC=()=>LANG==='en'?'en-GB':'fr-FR';
const fmt=n=>(Number(n)||0).toLocaleString(LANG==='en'?'en-US':'fr-FR')+_t(' د.م');
const nm=(arr,id)=>{const x=arr.find(y=>y.id===id);return x?(x.name||x.plate):'—';};
const dayLbl=d=>new Date(d+'T00:00:00').toLocaleDateString(LANG==='ar'?'ar-MA':LANG==='fr'?'fr-FR':'en-GB',{weekday:'long',day:'numeric',month:'long'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const wa=(phone,text)=>{let p=(phone||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p='212'+p.slice(1);else if(p.length===9&&/^[5-7]/.test(p))p='212'+p;return 'https://wa.me/'+p+'?text='+encodeURIComponent(text);};

const defaultDB=()=>({
  settings:{school:'Otoqol',absLimit:3},
  users:[{id:'u1',name:'المدير',role:'manager',username:'admin',password:'1234'},{id:'u2',name:'السكريتيرة',role:'secretary',username:'secretary',password:'1234'}],

const load=()=>{try{const r=localStorage.getItem(KEY);if(r){const o=Object.assign(defaultDB(),JSON.parse(r));if(!o.settings||!o.settings.school||o.settings.school==='مدرسة السياقة'||o.settings.school==='مدرسة الأمل')o.settings=Object.assign({},o.settings,{school:'Otoqol'});return o;}}catch(e){}return defaultDB();};

const hoursDone=(db,cid,type)=>db.sessions.reduce((s,x)=>{const a=x.att.find(y=>y.cid===cid);return s+((a&&counted(a)&&(!type||x.type===type))?Number(x.duration):0);},0);
const absCount=(db,cid)=>db.sessions.reduce((s,x)=>s+(x.att.some(a=>a.cid===cid&&a.status==='absent')?1:0),0);
const paidOf=(db,cid)=>db.payments.filter(p=>p.cid===cid).reduce((s,p)=>s+Number(p.amount),0);
const monStats=(db,mid)=>{
  const ss=db.sessions.filter(s=>s.monitorId===mid);
  const cids=[...new Set(ss.flatMap(s=>s.att.map(a=>a.cid)))];
  const done=ss.filter(s=>s.att.some(counted));
  const exams=db.candidates.filter(c=>cids.includes(c.id)).flatMap(c=>c.exams||[]).filter(e=>e.result==='نجح'||e.result==='رسب');
  const pass=exams.filter(e=>e.result==='نجح').length;
  const m=monthOf(today());
  return {cands:cids.length,sessions:ss.length,hoursTotal:done.reduce((t,s)=>t+Number(s.duration),0),hoursMonth:done.filter(s=>monthOf(s.date)===m).reduce((t,s)=>t+Number(s.duration),0),rate:exams.length?Math.round(pass*100/exams.length):null,absences:ss.reduce((t,s)=>t+s.att.filter(a=>a.status==='absent').length,0),cids};
};
const printReceipt=(db,c,p)=>{
  const w=window.open('','_blank');if(!w)return alert(_t('سمح بالنوافذ المنبثقة (popups) باش تطبع'));
  const left=Math.max(0,Number(c.price)-paidOf(db,c.id));
  const row=(a,b)=>'<tr><td>'+_t(a)+'</td><td>'+b+'</td></tr>';
  w.document.write('<html dir="'+(LANG==='ar'?'rtl':'ltr')+'"><head><meta charset="utf-8"><title>'+_t('وصل')+'</title><style>body{font-family:Tahoma,Arial;padding:30px;max-width:600px;margin:auto}h2{text-align:center}td{padding:8px;border-bottom:1px solid #ccc}table{width:100%;border-collapse:collapse}.s{margin-top:50px;display:flex;justify-content:space-between}</style></head><body><h2>'+esc(db.settings.school)+'</h2><h3 style="text-align:center">'+_t('وصل أداء رقم ')+p.no+'</h3><table>'+row('التاريخ',esc(p.date))+row('المترشح',esc(c.name))+row('رقم البطاقة الوطنية',esc(c.cin||'—'))+row('نوع الرخصة',esc(c.license))+row('المبلغ المؤدى','<b>'+fmt(p.amount)+'</b>')+row('ثمن الباقة',fmt(c.price))+row('مجموع المؤدى',fmt(paidOf(db,c.id)))+row('الباقي',fmt(left))+(p.note?row('ملاحظة',esc(p.note)):'')+'</table><div class="s"><span>'+_t('توقيع المترشح')+'</span><span>'+_t('ختم وتوقيع المدرسة')+'</span></div></body></html>');
  w.document.close();setTimeout(()=>w.print(),300);
};

const Wordmark=({h=30,teal})=><img src={teal?LOGO_T:LOGO_W} alt="Otoqol" style={{height:h,width:'auto',display:'block'}}/>;
const F=({l,children})=><label className="f"><span>{l}</span>{children}</label>;
const Tabs=({tabs,v,set})=><div className="tabs">{tabs.map(t=><button key={t[0]} className={v===t[0]?'on':''} onClick={()=>set(t[0])}>{t[1]}</button>)}</div>;
function Prompt({title,label,okLabel,onOk,onClose,required}){
  const [v,setV]=useState('');
  return <Modal title={title} onClose={onClose}><F l={label}><textarea rows="3" value={v} autoFocus onChange={e=>setV(e.target.value)}/></F><div className="row"><button className="b pri" onClick={()=>{if(required&&!v.trim())return;onOk(v.trim());onClose();}}>{okLabel||_t('تأكيد')}</button><button className="b" onClick={onClose}>{_t("إلغاء")}</button></div></Modal>;
}

/* ================= الحصص ================= */
const hFmt=t=>{const p=String(t).split(':');return Number(p[0])+'h'+(p[1]&&p[1]!=='00'?p[1]:'');};
const sessionMsg=(db,s,c,mode)=>{
  const kind=s.type==='code'?_t('wa:الكود'):_t('wa:السياقة');
  const line=(mode==='cancel'?_t('wa:الحصة ديال {k} تلغات:'):mode==='update'?_t('wa:الحصة ديال {k} تبدلات:'):_t('wa:الحصة ديال {k} تأكدات:')).replace('{k}',kind);
  return _t('wa:السلام ')+c.name+_t('wa:،')+'\n\n'+line+'\n'+s.date+' · '+hFmt(s.time)+'\n\n'+db.settings.school;
};
const absMsg=(db,c,s)=>_t('wa:السلام ')+c.name+_t('wa:،')+'\n\n'+(s?_t('wa:كنتي غايب(ة) فحصة {k} ديال {d}.').replace('{k}',s.type==='code'?_t('wa:الكود'):_t('wa:السياقة')).replace('{d}',s.date+' · '+hFmt(s.time)):_t('wa:كنتي غايب(ة) فالحصة الأخيرة ديالك.'))+'\n'+_t('wa:عافاك تواصل معانا باش نحددو موعد جديد.')+'\n\n'+db.settings.school;
function SendModal({s,mode,onClose}){
  const {db}=useC();
  const [done,setDone]=useState({});
  const rows=s.att.map(a=>db.candidates.find(x=>x.id===a.cid)).filter(Boolean);
  return <Modal title={_t('إرسال عبر واتساب — ')+s.date+' '+s.time} onClose={onClose}>
    <p className="meta">{_t("كل ضغطة كتحل واتساب بالرسالة واجدة (الموعد، المونيتور، السيارة، الساعات...). غير ضغط إرسال.")}</p>
    {rows.map(c=><div key={c.id} className="ar"><div><b>{c.name}</b><div className="meta">{c.phone||_t('ما كاينش رقم الهاتف')}</div></div>
      {c.phone?<a className="b wa" title={_t("واتساب")} target="_blank" rel="noreferrer" href={wa(c.phone,sessionMsg(db,s,c,mode))} onClick={()=>setDone(Object.assign({},done,{[c.id]:1}))}>{done[c.id]?<span style={{color:'#16a34a',fontWeight:700}}>✔</span>:<WaIcon/>}</a>:<span className="bd warn">{_t("بلا رقم")}</span>}</div>)}
    <div className="row"><button className="b" onClick={onClose}>{_t("سالا")}</button></div>
  </Modal>;
}
function SessionForm({s,defDate,onClose}){
  const {db,upd,L,notify,openSend}=useC();
  const [f,setF]=useState(s?{id:s.id,date:s.date,time:s.time,duration:s.duration,type:s.type,monitorId:s.monitorId,vehicleId:s.vehicleId,notes:s.notes}:{date:defDate,time:'09:00',duration:1,type:'conduite',monitorId:db.monitors[0]?db.monitors[0].id:'',vehicleId:'',notes:''});
  const [sel,setSel]=useState(s?s.att.map(a=>a.cid):[]);
  const [q,setQ]=useState('');
  const set=(k,v)=>setF(Object.assign({},f,{[k]:v}));
  const elig=db.candidates.filter(c=>(c.stage!=='done'||sel.includes(c.id))&&c.name.toLowerCase().includes(q.toLowerCase()));
  const save=()=>{
    if(!f.monitorId)return alert(_t('اختار المونيتور (زيدو أولا من صفحة المونيتورات)'));
    if(!sel.length)return alert(_t('اختار مترشح واحد على الأقل'));
    if(f.type==='conduite'&&!f.vehicleId)return alert(_t('اختار السيارة (زيدها أولا من صفحة السيارات)'));
    const st=toMin(f.time),en=st+Number(f.duration)*60;let why='';
    db.sessions.forEach(x=>{
      if(why||x.id===f.id||x.date!==f.date)return;
      if(!(st<toMin(x.time)+Number(x.duration)*60&&toMin(x.time)<en))return;
      if(x.monitorId===f.monitorId)why=_t('المونيتور عندو حصة أخرى فهاد الوقت');
      else if(f.type==='conduite'&&x.type==='conduite'&&f.vehicleId&&x.vehicleId===f.vehicleId)why=_t('السيارة محجوزة فهاد الوقت');
      else{const c=x.att.find(a=>sel.includes(a.cid)&&a.status!=='absent');if(c)why=_t('المترشح ')+nm(db.candidates,c.cid)+_t(' عندو حصة أخرى فهاد الوقت');}
    });
    if(why)return alert(_t('تضارب: ')+why);
    upd(n=>{
      const att=sel.map(cid=>{const old=s&&s.att.find(a=>a.cid===cid);return old||{cid:cid,status:'planned',reason:''};});
      const data={date:f.date,time:f.time,duration:Number(f.duration),type:f.type,monitorId:f.monitorId,vehicleId:f.type==='conduite'?f.vehicleId:'',notes:f.notes||'',att:att};
      if(s){
        Object.assign(n.sessions.find(x=>x.id===s.id),data);
        notify(n,'m:'+data.monitorId,_t('تعدلات حصة: ')+data.date+' '+data.time);
        if(s.monitorId!==data.monitorId)notify(n,'m:'+s.monitorId,_t('تحيدات ليك حصة: ')+s.date+' '+s.time);
        L(n,_t('تعديل حصة ')+data.date+' '+data.time);
      }else{
        n.sessions.push(Object.assign({id:uid()},data));
        notify(n,'m:'+data.monitorId,_t('حصة جديدة: ')+data.date+' '+data.time+' ('+typeLbl[data.type]+')');
        L(n,_t('حصة جديدة ')+data.date+' '+data.time);
      }
    });
    openSend({mode:s?'update':'new',s:{date:f.date,time:f.time,duration:Number(f.duration),type:f.type,monitorId:f.monitorId,vehicleId:f.type==='conduite'?f.vehicleId:'',notes:f.notes||'',att:sel.map(cid=>({cid:cid}))}});
    onClose();
  };
  return <Modal title={s?_t('تعديل حصة'):_t('حصة جديدة')} onClose={onClose} wide>
    <div className="fg">
      <F l={_t("التاريخ")}><input type="date" value={f.date} onChange={e=>set('date',e.target.value)}/></F>
      <F l={_t("الساعة")}><input type="time" value={f.time} onChange={e=>set('time',e.target.value)}/></F>
      <F l={_t("المدة (ساعات)")}><input type="number" min="0.5" step="0.5" value={f.duration} onChange={e=>set('duration',e.target.value)}/></F>
      <F l={_t("النوع")}><select value={f.type} onChange={e=>set('type',e.target.value)}><option value="conduite">{_t("تطبيقي (سياقة)")}</option><option value="code">{_t("كود (نظري)")}</option></select></F>
      <F l={_t("المونيتور")}><select value={f.monitorId} onChange={e=>set('monitorId',e.target.value)}><option value="">{_t("— اختار —")}</option>{db.monitors.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select></F>
      {f.type==='conduite'&&<F l={_t("السيارة")}><select value={f.vehicleId} onChange={e=>set('vehicleId',e.target.value)}><option value="">{_t("— اختار —")}</option>{db.vehicles.map(v=><option key={v.id} value={v.id}>{v.plate} {v.model}</option>)}</select></F>}
    </div>
    <F l={_t('المترشحون (')+sel.length+')'}>
      <input type="search" placeholder={_t("بحث...")} value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:6}}/>
      <div className="pick">{elig.length?elig.map(c=><label key={c.id}><input type="checkbox" checked={sel.includes(c.id)} onChange={e=>setSel(e.target.checked?sel.concat(c.id):sel.filter(x=>x!==c.id))}/>{c.name} <small className="meta">({c.license})</small></label>):<div className="meta">{_t("ما كاين حتى مترشح")}</div>}</div>
    </F>
    <F l={_t("ملاحظات")}><input value={f.notes||''} onChange={e=>set('notes',e.target.value)}/></F>
    <div className="row"><button className="b pri" onClick={save}>{_t("حفظ")}</button><button className="b" onClick={onClose}>{_t("إلغاء")}</button></div>
  </Modal>;
}

function SessionCard({s,monitorMode}){
  const {db,user,mark,upd,L,notify,openSend}=useC();
  const [edit,setEdit]=useState(false);
  const [absFor,setAbsFor]=useState(null);
  const [noteFor,setNoteFor]=useState(null);
  const [req,setReq]=useState(false);
  const isMon=user.role==='monitor';
  const veh=db.vehicles.find(v=>v.id===s.vehicleId);
  const del=()=>{if(!confirm(_t('حيد هاد الحصة؟')))return;upd(n=>{n.sessions=n.sessions.filter(x=>x.id!==s.id);notify(n,'m:'+s.monitorId,_t('تلغات حصة: ')+s.date+' '+s.time);L(n,_t('حذف حصة ')+s.date+' '+s.time);});if(confirm(_t('بغيتي تبعت رسالة الإلغاء للمترشحين عبر واتساب؟')))openSend({mode:'cancel',s:s});};
  const pending=db.requests.find(r=>r.sessionId===s.id&&r.status==='pending');
  return <div className={'sc '+s.type}>
    <div className="sh">
      <b>{s.time} · {s.duration} {_t("س")}</b>
      <span className={'bd '+(s.type==='code'?'info':'ok')}>{typeLbl[s.type]}</span>
      {!monitorMode&&<span className="meta">👤 {nm(db.monitors,s.monitorId)}</span>}
      {veh&&<span className="meta">🚗 {veh.plate}</span>}
      <span className="sp"></span>
      {!isMon&&<button className="b wa" title={_t("واتساب لكل المترشحين")} onClick={()=>openSend({mode:'new',s:s})}><WaIcon/></button>}
      {!isMon&&<><button className="b" onClick={()=>setEdit(true)}>{_t("تعديل")}</button><button className="b del" onClick={del}>{_t("حذف")}</button></>}
      {isMon&&!pending&&<button className="b" onClick={()=>setReq(true)}>{_t("طلب تغيير")}</button>}
      {isMon&&pending&&<span className="bd warn">{_t("طلب التغيير فالانتظار")}</span>}
    </div>
    {s.notes&&<div className="meta">📌 {s.notes}</div>}
    {s.att.map(a=>{
      const c=db.candidates.find(x=>x.id===a.cid);if(!c)return null;
      const locked=isMon&&a.status==='absent';
      const msg=absMsg(db,c,s);
      return <div key={a.cid} className={'ar '+a.status}>
        <div className="an"><b>{c.name}</b> <small className="meta">{c.phone}</small>
          {monitorMode&&<small className="meta"> · {hoursDone(db,c.id)}/{Number(c.codeHours)+Number(c.driveHours)} {_t("س")}</small>}
          {a.status==='absent'&&<div className="rm">{_t("تحيد من الحصة")}{a.reason?' — '+a.reason:''}</div>}
        </div>
        <div className="ab">
          {['present','late','absent'].map(st=><button key={st} disabled={locked} className={'b '+st+(a.status===st?' on':'')} onClick={()=>st==='absent'?setAbsFor(c.id):mark(s.id,c.id,st,'')}>{statusLbl[st]}</button>)}
          {a.status!=='planned'&&!locked&&<button className="b" title={_t("رجّع للحالة الأولى")} onClick={()=>mark(s.id,c.id,'planned','')}>↺</button>}
          {monitorMode&&<button className="b" title={_t("ملاحظة")} onClick={()=>setNoteFor(c.id)}>📝</button>}
          <a className="b wa" target="_blank" rel="noreferrer" title={_t("واتساب")} href={wa(c.phone,a.status==='absent'?msg:sessionMsg(db,s,c,'new'))}><WaIcon/></a>
        </div>
      </div>;
    })}
    {edit&&<SessionForm s={s} defDate={s.date} onClose={()=>setEdit(false)}/>}
    {absFor&&<Prompt title={_t("تسجيل غياب")} label={_t("سبب الغياب (اختياري)")} okLabel={_t("تأكيد الغياب")} onOk={v=>mark(s.id,absFor,'absent',v)} onClose={()=>setAbsFor(null)}/>}
    {noteFor&&<Prompt title={_t('ملاحظة على ')+nm(db.candidates,noteFor)} label={_t("الملاحظة / التقييم")} required onOk={v=>upd(n=>{n.notes.unshift({id:uid(),cid:noteFor,monitorId:user.id,text:v,date:today()});})} onClose={()=>setNoteFor(null)}/>}
    {req&&<Prompt title={_t("طلب تغيير الحصة")} label={_t("شنو بغيتي تتبدل؟ (الوقت، التاريخ...)")} required okLabel={_t("إرسال")} onOk={v=>upd(n=>{n.requests.unshift({id:uid(),sessionId:s.id,monitorId:user.id,text:v,status:'pending',date:today()});notify(n,'secretary',_t('طلب تغيير حصة من ')+user.name+' ('+s.date+' '+s.time+'): '+v);})} onClose={()=>setReq(false)}/>}
  </div>;
}

function Sessions(){
  const {db}=useC();
  const [date,setDate]=useState(today());
  const [form,setForm]=useState(false);
  const list=db.sessions.filter(s=>s.date===date).sort((a,b)=>a.time.localeCompare(b.time));

/* ================= المترشحون ================= */
const BASIC=['name','cin','phone','address','license','price','codeHours','driveHours','stage','medical','notes'];
function CandidateModal({id,onClose}){
  const {db,upd,user,L}=useC();
  const c=db.candidates.find(x=>x.id===id);
  const [tab,setTab]=useState('info');
  const [f,setF]=useState(c?Object.assign({},c):{name:'',cin:'',phone:'',address:'',license:'B',price:0,codeHours:10,driveHours:20,stage:'reg',medical:false,notes:''});
  const [ex,setEx]=useState({type:'code',date:today(),result:'في الانتظار'});
  const [pay,setPay]=useState({amount:'',date:today(),note:''});
  const set=(k,v)=>setF(Object.assign({},f,{[k]:v}));
  const staffDel=user.role==='manager';
  const save=()=>{
    if(!f.name.trim())return alert(_t('الاسم ضروري'));
    upd(n=>{
      if(c){const t=n.candidates.find(x=>x.id===c.id);BASIC.forEach(k=>{t[k]=f[k];});L(n,_t('تعديل مترشح: ')+f.name);}
      else{const o={id:uid(),exams:[],createdAt:today()};BASIC.forEach(k=>{o[k]=f[k];});n.candidates.push(o);L(n,_t('مترشح جديد: ')+f.name);}
    });
    onClose();
  };
  const delC=()=>{if(!confirm(_t('حيد هاد المترشح؟ غادي تتحيد معاه الدفعات ديالو.')))return;upd(n=>{n.candidates=n.candidates.filter(x=>x.id!==c.id);n.payments=n.payments.filter(p=>p.cid!==c.id);n.sessions.forEach(s=>{s.att=s.att.filter(a=>a.cid!==c.id);});n.sessions=n.sessions.filter(s=>s.att.length);L(n,_t('حذف مترشح: ')+c.name);});onClose();};
  const addEx=()=>upd(n=>{const t=n.candidates.find(x=>x.id===c.id);t.exams.push(Object.assign({id:uid()},ex));if(ex.result==='نجح'){if(ex.type==='code'&&t.stage!=='done')t.stage='drive';if(ex.type==='conduite')t.stage='done';}L(n,_t('امتحان ')+(ex.type==='code'?_t('كود'):_t('سياقة'))+' ('+_t(ex.result)+'): '+t.name);});
  const setExRes=(eid,r)=>upd(n=>{const t=n.candidates.find(x=>x.id===c.id);const e=t.exams.find(x=>x.id===eid);e.result=r;if(r==='نجح'){if(e.type==='code'&&t.stage!=='done')t.stage='drive';if(e.type==='conduite')t.stage='done';}});
  const delEx=eid=>upd(n=>{const t=n.candidates.find(x=>x.id===c.id);t.exams=t.exams.filter(x=>x.id!==eid);});
  const addPay=()=>{
    if(!(Number(pay.amount)>0))return alert(_t('دخل مبلغ صحيح'));
    upd(n=>{const no=n.payments.reduce((m,p)=>Math.max(m,p.no||0),0)+1;n.payments.push({id:uid(),no:no,cid:c.id,amount:Number(pay.amount),date:pay.date,note:pay.note});L(n,_t('دفعة ')+pay.amount+_t(' من ')+c.name);});
    setPay({amount:'',date:today(),note:''});
  };
  const delPay=pid=>{if(!confirm(_t('حيد هاد الدفعة؟')))return;upd(n=>{n.payments=n.payments.filter(p=>p.id!==pid);L(n,_t('حذف دفعة'));});};
  const tabs=c?[['info',_t('البيانات')],['exams',_t('الامتحانات')],['ses',_t('الحصص والغياب')],['pay',_t('الدفعات')],['notes',_t('ملاحظات المدربين')]]:[['info',_t('البيانات')]];
  const sess=c?db.sessions.filter(s=>s.att.some(a=>a.cid===c.id)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)):[];
  return <Modal title={c?c.name:_t('مترشح جديد')} onClose={onClose} wide>
    {c&&<div className="row" style={{marginTop:0,marginBottom:10}}>
      <span className="bd info">{stageLbl[c.stage]}</span>
      <span className="bd">{_t("كود")} {hoursDone(db,c.id,'code')}/{c.codeHours} {_t("س")}</span>
      <span className="bd">{_t("سياقة")} {hoursDone(db,c.id,'conduite')}/{c.driveHours} {_t("س")}</span>
      {absCount(db,c.id)>0&&<span className={'bd '+(absCount(db,c.id)>=db.settings.absLimit?'bad':'warn')}>{_t("غيابات:")} {absCount(db,c.id)}</span>}
    </div>}
    <Tabs tabs={tabs} v={tab} set={setTab}/>
    {tab==='info'&&<div>
      <div className="fg">
        <F l={_t("الاسم الكامل")}><input value={f.name} onChange={e=>set('name',e.target.value)}/></F>
        <F l={_t("رقم البطاقة الوطنية")}><input value={f.cin} onChange={e=>set('cin',e.target.value)}/></F>
        <F l={_t("الهاتف")}><input value={f.phone} onChange={e=>set('phone',e.target.value)}/></F>
        <F l={_t("العنوان")}><input value={f.address} onChange={e=>set('address',e.target.value)}/></F>
        <F l={_t("نوع الرخصة")}><select value={f.license} onChange={e=>set('license',e.target.value)}>{LICENSES.map(l=><option key={l}>{l}</option>)}</select></F>
        <F l={_t("ثمن الباقة (د.م)")}><input type="number" value={f.price} onChange={e=>set('price',e.target.value)}/></F>
        <F l={_t("ساعات الكود")}><input type="number" value={f.codeHours} onChange={e=>set('codeHours',e.target.value)}/></F>
        <F l={_t("ساعات السياقة")}><input type="number" value={f.driveHours} onChange={e=>set('driveHours',e.target.value)}/></F>
        <F l={_t("المرحلة")}><select value={f.stage} onChange={e=>set('stage',e.target.value)}>{Object.keys(stageLbl).map(k=><option key={k} value={k}>{stageLbl[k]}</option>)}</select></F>
        <F l={_t("الشهادة الطبية")}><select value={f.medical?'1':'0'} onChange={e=>set('medical',e.target.value==='1')}><option value="0">{_t("ناقصة")}</option><option value="1">{_t("متوفرة")}</option></select></F>
      </div>
      <F l={_t("ملاحظات")}><textarea rows="2" value={f.notes||''} onChange={e=>set('notes',e.target.value)}/></F>
      <div className="row"><button className="b pri" onClick={save}>{_t("حفظ")}</button>{c&&staffDel&&<button className="b del" onClick={delC}>{_t("حذف المترشح")}</button>}</div>
    </div>}
    {tab==='exams'&&c&&<div>
      <div className="tw"><table><thead><tr><th>{_t("النوع")}</th><th>{_t("التاريخ")}</th><th>{_t("النتيجة")}</th><th></th></tr></thead><tbody>
        {(c.exams||[]).map(e=><tr key={e.id}><td>{e.type==='code'?_t('كود'):_t('سياقة')}</td><td>{e.date}</td><td><select value={e.result} onChange={ev=>setExRes(e.id,ev.target.value)}><option value="في الانتظار">{_t("في الانتظار")}</option><option value="نجح">{_t("نجح")}</option><option value="رسب">{_t("رسب")}</option></select></td><td><button className="b del" onClick={()=>delEx(e.id)}>✕</button></td></tr>)}
        {!(c.exams||[]).length&&<tr><td colSpan="4" className="empty">{_t("ما كاين حتى محاولة")}</td></tr>}
      </tbody></table></div>
      <h3 style={{marginTop:14}}>{_t("محاولة جديدة")}</h3>
      <div className="fg">
        <F l={_t("النوع")}><select value={ex.type} onChange={e=>setEx(Object.assign({},ex,{type:e.target.value}))}><option value="code">{_t("كود")}</option><option value="conduite">{_t("سياقة")}</option></select></F>
        <F l={_t("التاريخ")}><input type="date" value={ex.date} onChange={e=>setEx(Object.assign({},ex,{date:e.target.value}))}/></F>
        <F l={_t("النتيجة")}><select value={ex.result} onChange={e=>setEx(Object.assign({},ex,{result:e.target.value}))}><option value="في الانتظار">{_t("في الانتظار")}</option><option value="نجح">{_t("نجح")}</option><option value="رسب">{_t("رسب")}</option></select></F>
      </div>
      <button className="b pri" onClick={addEx}>{_t("زيد المحاولة")}</button>
    </div>}
    {tab==='ses'&&c&&<div className="tw"><table><thead><tr><th>{_t("التاريخ")}</th><th>{_t("الساعة")}</th><th>{_t("النوع")}</th><th>{_t("المونيتور")}</th><th>{_t("الحالة")}</th></tr></thead><tbody>
      {sess.map(s=>{const a=s.att.find(x=>x.cid===c.id);return <tr key={s.id}><td>{s.date}</td><td>{s.time}</td><td>{typeLbl[s.type]}</td><td>{nm(db.monitors,s.monitorId)}</td><td><span className={'bd '+(a.status==='absent'?'bad':a.status==='present'?'ok':a.status==='late'?'warn':'')}>{statusLbl[a.status]}</span>{a.reason?' — '+a.reason:''}</td></tr>;})}
      {!sess.length&&<tr><td colSpan="5" className="empty">{_t("ما كاين حتى حصة")}</td></tr>}
    </tbody></table></div>}
    {tab==='pay'&&c&&<div>
      <div className="grid"><div className="stat"><small>{_t("ثمن الباقة")}</small><b>{fmt(c.price)}</b></div><div className="stat"><small>{_t("المؤدى")}</small><b>{fmt(paidOf(db,c.id))}</b></div><div className="stat"><small>{_t("الباقي")}</small><b>{fmt(Math.max(0,Number(c.price)-paidOf(db,c.id)))}</b></div></div>
      <div className="tw"><table><thead><tr><th>{_t("رقم")}</th><th>{_t("التاريخ")}</th><th>{_t("المبلغ")}</th><th>{_t("ملاحظة")}</th><th></th></tr></thead><tbody>
        {db.payments.filter(p=>p.cid===c.id).map(p=><tr key={p.id}><td>{p.no}</td><td>{p.date}</td><td>{fmt(p.amount)}</td><td>{p.note}</td><td style={{whiteSpace:'nowrap'}}><button className="b" onClick={()=>printReceipt(db,c,p)}>{_t("🖨 وصل")}</button>{staffDel&&<button className="b del" onClick={()=>delPay(p.id)}>✕</button>}</td></tr>)}
        {!db.payments.some(p=>p.cid===c.id)&&<tr><td colSpan="5" className="empty">{_t("ما كاين حتى دفعة")}</td></tr>}
      </tbody></table></div>
      <h3 style={{marginTop:14}}>{_t("دفعة جديدة")}</h3>
      <div className="fg">
        <F l={_t("المبلغ")}><input type="number" value={pay.amount} onChange={e=>setPay(Object.assign({},pay,{amount:e.target.value}))}/></F>
        <F l={_t("التاريخ")}><input type="date" value={pay.date} onChange={e=>setPay(Object.assign({},pay,{date:e.target.value}))}/></F>
        <F l={_t("ملاحظة")}><input value={pay.note} onChange={e=>setPay(Object.assign({},pay,{note:e.target.value}))}/></F>
      </div>
      <button className="b pri" onClick={addPay}>{_t("تسجيل الدفعة")}</button>
    </div>}
    {tab==='notes'&&c&&<div>
      {db.notes.filter(n=>n.cid===c.id).map(n=><div key={n.id} className="nt"><div className="meta">{n.date} · {nm(db.monitors,n.monitorId)}</div>{n.text}</div>)}
      {!db.notes.some(n=>n.cid===c.id)&&<div className="empty">{_t("ما كاين حتى ملاحظة")}</div>}
    </div>}
  </Modal>;
}

      <button className="b pri" onClick={()=>setSel(null)}>{_t("+ مترشح جديد")}</button>
    </div>
    <div className="tw"><table><thead><tr><th>{_t("الاسم")}</th><th>{_t("الهاتف")}</th><th>{_t("الرخصة")}</th><th>{_t("المرحلة")}</th><th>{_t("الكود")}</th><th>{_t("السياقة")}</th><th>{_t("الباقي")}</th><th>{_t("غيابات")}</th></tr></thead><tbody>

        <td><b>{c.name}</b></td><td>{c.phone}</td><td>{c.license}</td><td><span className="bd info">{stageLbl[c.stage]}</span></td>

        <td>{left>0?<span className="bd warn">{fmt(left)}</span>:<span className="bd ok">{_t("خالص")}</span>}</td>
        <td>{ab>0?<span className={'bd '+(ab>=db.settings.absLimit?'bad':'warn')}>{ab}</span>:'—'}</td></tr>;})}

    </tbody></table></div>

}

/* ================= المونيتورات ================= */
function Monitors(){
  const {db,upd,L}=useC();
  const [f,setF]=useState(null);
  const set=(k,v)=>setF(Object.assign({},f,{[k]:v}));
  const save=()=>{
    if(!f.name.trim()||!f.username.trim()||!f.password.trim())return alert(_t('الاسم، اسم المستخدم وكلمة السر ضروريين'));
    const taken=db.users.concat(db.monitors).some(u=>u.username===f.username&&u.id!==f.id);
    if(taken)return alert(_t('اسم المستخدم مستعمل من قبل'));
    upd(n=>{if(f.id){Object.assign(n.monitors.find(m=>m.id===f.id),f);}else{n.monitors.push(Object.assign({},f,{id:uid()}));}L(n,_t('مونيتور: ')+f.name);});
    setF(null);
  };

function Finance(){

  const [ex,setEx]=useState({label:'',category:'بنزين',amount:'',date:today(),vehicleId:''});
  const addPay=()=>{
    const c=db.candidates.find(x=>x.id===pay.cid);
    if(!c)return alert(_t('اختار المترشح'));if(!(Number(pay.amount)>0))return alert(_t('دخل مبلغ صحيح'));
    upd(n=>{const no=n.payments.reduce((m,p)=>Math.max(m,p.no||0),0)+1;n.payments.push({id:uid(),no:no,cid:pay.cid,amount:Number(pay.amount),date:pay.date,note:pay.note});L(n,_t('دفعة ')+pay.amount+_t(' من ')+c.name);});

  const addEx=()=>{if(!ex.label.trim()||!(Number(ex.amount)>0))return alert(_t('دخل الوصف والمبلغ'));upd(n=>{n.expenses.push(Object.assign({id:uid()},ex,{amount:Number(ex.amount)}));L(n,_t('مصروف ')+ex.amount+': '+ex.label);});setEx({label:'',category:'بنزين',amount:'',date:today(),vehicleId:''});};

        <F l={_t("المبلغ")}><input type="number" value={pay.amount} onChange={e=>setPay(Object.assign({},pay,{amount:e.target.value}))}/></F>
        <F l={_t("التاريخ")}><input type="date" value={pay.date} onChange={e=>setPay(Object.assign({},pay,{date:e.target.value}))}/></F>
        <F l={_t("ملاحظة")}><input value={pay.note} onChange={e=>setPay(Object.assign({},pay,{note:e.target.value}))}/></F>
      </div><button className="b pri" onClick={addPay}>{_t("تسجيل")}</button></div>
      <div className="tw"><table><thead><tr><th>{_t("رقم")}</th><th>{_t("التاريخ")}</th><th>{_t("المترشح")}</th><th>{_t("المبلغ")}</th><th></th></tr></thead><tbody>
        {db.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.no-a.no).slice(0,100).map(p=>{const c=db.candidates.find(x=>x.id===p.cid);return <tr key={p.id}><td>{p.no}</td><td>{p.date}</td><td>{c?c.name:'—'}</td><td>{fmt(p.amount)}</td><td>{c&&<button className="b" onClick={()=>printReceipt(db,c,p)}>{_t("🖨 وصل")}</button>}</td></tr>;})}
        {!db.payments.length&&<tr><td colSpan="5" className="empty">{_t("ما كاين حتى دفعة")}</td></tr>}
      </tbody></table></div>
    </div>}
    {tab==='arr'&&<div className="tw"><table><thead><tr><th>{_t("المترشح")}</th><th>{_t("الهاتف")}</th><th>{_t("ثمن الباقة")}</th><th>{_t("المؤدى")}</th><th>{_t("الباقي")}</th></tr></thead><tbody>
      {arrears.map(x=><tr key={x.c.id}><td>{x.c.name}</td><td>{x.c.phone}</td><td>{fmt(x.c.price)}</td><td>{fmt(paidOf(db,x.c.id))}</td><td><span className="bd warn">{fmt(x.left)}</span></td></tr>)}
      {!arrears.length&&<tr><td colSpan="5" className="empty">{_t("ما كاين حتى متأخرات 👌")}</td></tr>}

        <F l={_t("التاريخ")}><input type="date" value={ex.date} onChange={e=>setEx(Object.assign({},ex,{date:e.target.value}))}/></F>

        {db.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100).map(e=><tr key={e.id}><td>{e.date}</td><td>{e.label}</td><td>{_t(e.category)}</td><td>{e.vehicleId?nm(db.vehicles,e.vehicleId):'—'}</td><td>{fmt(e.amount)}</td><td><button className="b del" onClick={()=>{if(confirm(_t('حيد المصروف؟')))upd(n=>{n.expenses=n.expenses.filter(x=>x.id!==e.id);});}}>✕</button></td></tr>)}
        {!db.expenses.length&&<tr><td colSpan="6" className="empty">{_t("ما كاين حتى مصروف")}</td></tr>}
      </tbody></table></div>
    </div>}
    {tab==='rep'&&mgr&&<div className="tw"><table><thead><tr><th>{_t("الشهر")}</th><th>{_t("المداخيل")}</th><th>{_t("المصاريف")}</th><th>{_t("الصافي")}</th></tr></thead><tbody>
      {months.map(m=>{const i=db.payments.filter(p=>monthOf(p.date)===m).reduce((s,p)=>s+Number(p.amount),0);const e=db.expenses.filter(p=>monthOf(p.date)===m).reduce((s,p)=>s+Number(p.amount),0);return <tr key={m}><td>{m}</td><td>{fmt(i)}</td><td>{fmt(e)}</td><td><span className={'bd '+(i-e>=0?'ok':'bad')}>{fmt(i-e)}</span></td></tr>;})}
      {!months.length&&<tr><td colSpan="4" className="empty">{_t("ما كاين حتى معطيات")}</td></tr>}

      <td><span className={'bd '+(r.status==='approved'?'ok':r.status==='rejected'?'bad':'warn')}>{r.status==='approved'?_t('مقبول'):r.status==='rejected'?_t('مرفوض'):_t('فالانتظار')}</span></td>
      <td style={{whiteSpace:'nowrap'}}>{r.status==='pending'&&<><button className="b pri" onClick={()=>decide(r,'approved')}>{_t("قبول")}</button><button className="b del" onClick={()=>decide(r,'rejected')}>{_t("رفض")}</button></>}</td></tr>;})}

/* ================= لوحة القيادة ================= */
function Dashboard(){
  const {db,user}=useC();
  const t=today(),m=monthOf(t);
  const todays=db.sessions.filter(s=>s.date===t).sort((a,b)=>a.time.localeCompare(b.time));
  const income=db.payments.filter(p=>monthOf(p.date)===m).reduce((s,p)=>s+Number(p.amount),0);
  const exp=db.expenses.filter(p=>monthOf(p.date)===m).reduce((s,p)=>s+Number(p.amount),0);
  const debt=db.candidates.reduce((s,c)=>s+Math.max(0,Number(c.price)-paidOf(db,c.id)),0);
  const active=db.candidates.filter(c=>c.stage!=='done').length;
  const alerts=[];
  db.vehicles.forEach(v=>[['insurance',_t('التأمين')],['visit',_t('الفحص التقني')],['tax',_t('الضريبة')]].forEach(k=>{const d=daysLeft(v[k[0]]);if(d!==null&&d<=30)alerts.push({lvl:d<0?'bad':'warn',text:v.plate+': '+k[1]+(d<0?_t(' منتهي منذ ')+(-d)+_t(' يوم'):_t(' ينتهي بعد ')+d+_t(' يوم'))});}));
  db.candidates.forEach(c=>{const a=absCount(db,c.id);if(a>=db.settings.absLimit)alerts.push({lvl:'warn',text:_t('غياب متكرر: ')+c.name+' ('+a+_t(' غيابات)')});});
  const pend=db.requests.filter(r=>r.status==='pending').length;
  if(pend)alerts.push({lvl:'warn',text:_t('عندك ')+pend+_t(' طلب تغيير فالانتظار')});
  const rate=(()=>{const e=db.candidates.flatMap(c=>c.exams||[]).filter(x=>x.result==='نجح'||x.result==='رسب');return e.length?Math.round(e.filter(x=>x.result==='نجح').length*100/e.length)+'%':'—';})();
  return <div>
    <div className="grid">
      <div className="stat"><small>{_t("مترشحون نشيطون")}</small><b>{active}</b></div>
      <div className="stat"><small>{_t("حصص اليوم")}</small><b>{todays.length}</b></div>
      <div className="stat"><small>{_t("نسبة النجاح")}</small><b>{rate}</b></div>
      <div className="stat"><small>{_t("مداخيل الشهر")}</small><b>{fmt(income)}</b></div>
      {user.role==='manager'&&<div className="stat"><small>{_t("مصاريف الشهر")}</small><b>{fmt(exp)}</b></div>}
      <div className="stat"><small>{_t("المتأخرات")}</small><b>{fmt(debt)}</b></div>
    </div>
    {alerts.length>0&&<div className="card"><h3>{_t("تنبيهات")}</h3>{alerts.map((a,i)=><div key={i} className={'al '+a.lvl}>{a.text}</div>)}</div>}
    <h3>{_t("حصص اليوم —")} {dayLbl(t)}</h3>
    {todays.length?todays.map(s=><SessionCard key={s.id} s={s}/>):<div className="card empty">{_t("ما كاين حتى حصة اليوم")}</div>}
  </div>;
}

/* ================= واجهة المونيتور ================= */
function MySchedule(){
  const {db,user}=useC();
  const [sc,setSc]=useState('today');
  const t=today();
  let list=db.sessions.filter(s=>s.monitorId===user.id);
  if(sc==='today')list=list.filter(s=>s.date===t);
  else if(sc==='week')list=list.filter(s=>s.date>=t&&s.date<=addDays(t,6));
  else list=list.filter(s=>s.date<t&&s.date>=addDays(t,-30));
  list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(sc==='past')list.reverse();
  const dates=[...new Set(list.map(s=>s.date))];
  return <div>
    <Tabs tabs={[['today',_t('اليوم')],['week',_t('7 أيام الجاية')],['past',_t('الفايتة (30 يوم)')]]} v={sc} set={setSc}/>
    {dates.map(d=><div key={d}><h3>{dayLbl(d)}</h3>{list.filter(s=>s.date===d).map(s=><SessionCard key={s.id} s={s} monitorMode/>)}</div>)}
    {!dates.length&&<div className="card empty">{_t("ما كاين حتى حصة")}</div>}
  </div>;
}

  return <div className="grid">
    <div className="stat"><small>{_t("ساعات هاد الشهر")}</small><b>{s.hoursMonth}</b></div>

/* ================= Otoqol sync (server storage) — added for the backend ================= */
const OQ=(()=>{
  const H={'Content-Type':'application/json','X-Otoqol':'1'};
  const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
  let school=null,ver=0,base=null,last=null,dirty=false,timer=null,inflight=false,again=false,setter=null,status='ok',subs=[],poll=null;
  const ck=k=>'oq_'+k+'_'+school.id;
  const setStatus=s=>{status=s;subs.forEach(f=>f(s));};
  const persist=()=>ls.set(ck('state'),JSON.stringify({ver:ver,base:base,dirty:dirty}));
  async function api(method,url,body,keepalive){
    const r=await fetch(url,{method:method,headers:H,credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body),keepalive:!!keepalive});
    let j=null;try{j=await r.json();}catch(e){}
    if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;e.body=j;throw e;}
    return j;
  }
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&x.id!=null);
  function mergeArr(b,l,r){
    const bm=new Map((b||[]).map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x]));const out=[];
    l.forEach(x=>{const bx=bm.get(x.id),rx=rm.get(x.id);
      if(!bx)return out.push(x);                       // new locally
      if(same(x,bx)){if(rx)out.push(rx);return;}       // untouched locally -> remote version (or remote deleted)
      out.push(rx&&isObj(rx)?merge3(bx,x,rx):x);       // edited locally
    });
    r.forEach((x,i)=>{if(!lm.has(x.id)&&!bm.has(x.id))out.splice(Math.min(i,out.length),0,x);}); // new remotely
    return out;
  }
  function merge3(b,l,r){
    if(r==null)return l;if(l==null)return r;b=b||{};
    const out={};new Set(Object.keys(l).concat(Object.keys(r))).forEach(k=>{
      const bk=b[k],lk=l[k],rk=r[k];
      if(!(k in l)){if(!(k in b))out[k]=rk;return;}
      if(!(k in r)){out[k]=lk;return;}
      if(same(lk,bk))out[k]=rk;else if(same(rk,bk))out[k]=lk;
      else if(idArr(lk)&&idArr(rk))out[k]=mergeArr(idArr(bk)?bk:[],lk,rk);
      else if(isObj(lk)&&isObj(rk))out[k]=merge3(isObj(bk)?bk:{},lk,rk);
      else out[k]=lk;
    });return out;
  }
  const schedule=ms=>{clearTimeout(timer);timer=setTimeout(push,ms);};
  async function push(){
    if(!dirty||!school)return;
    if(inflight){again=true;return;}
    inflight=true;setStatus('saving');const sent=last;
    try{
      const r=await api('PUT','/api/db',{version:ver,data:JSON.parse(sent)});
      ver=r.version;base=sent;dirty=last!==sent;persist();setStatus(dirty?'saving':'ok');
    }catch(e){
      if(e.status===409){inflight=false;await pull();return;}
      if(e.status===401||e.status===403)setStatus('auth');else{setStatus('offline');schedule(10000);}
    }finally{inflight=false;}
    if(again||dirty){again=false;schedule(400);}
  }
  async function pull(){
    if(inflight)return;inflight=true;
    try{
      const r=await api('GET','/api/db');if(!r.data){inflight=false;return;}
      const remote=JSON.stringify(r.data);
      const local=last?JSON.parse(last):null;
      const merged=dirty&&local?merge3(base?JSON.parse(base):null,local,r.data):r.data;
      ver=r.version;base=remote;const ms=JSON.stringify(merged);dirty=ms!==remote;persist();
      if(ms!==last){last=ms;ls.set(ck('cache'),ms);ls.set(KEY,ms);if(setter)setter(merged);}
      setStatus(dirty?'saving':'ok');if(dirty)schedule(300);
    }catch(e){setStatus(e.status===401||e.status===403?'auth':'offline');}
    finally{inflight=false;}
  }
  async function check(){
    if(!school||inflight)return;
    try{const r=await api('GET','/api/db/version');if(r.version!==ver)await pull();else if(dirty)push();else if(status!=='ok')setStatus('ok');}
    catch(e){setStatus(e.status===401||e.status===403?'auth':'offline');}
  }
  /** Prepare local cache for this school; returns the DB object App must start with. */
  function start(sch,server,importLocal){
    school=sch;
    if(ls.get('oq_owner')!==String(sch.id)){try{sessionStorage.removeItem('ae_user');localStorage.removeItem('ae_user');}catch(e){}}
    ls.set('oq_owner',String(sch.id));ls.set('oq_last_school',JSON.stringify(sch));
    let st={};try{st=JSON.parse(ls.get(ck('state'))||'{}');}catch(e){}
    const cache=ls.get(ck('cache'));let data;
    if(importLocal){data=importLocal;ver=server?server.version:0;base=null;dirty=true;}
    else if(server&&server.data){
      ver=server.version;base=JSON.stringify(server.data);
      if(st.dirty&&cache){data=merge3(st.base?JSON.parse(st.base):null,JSON.parse(cache),server.data);dirty=JSON.stringify(data)!==base;}
      else{data=server.data;dirty=false;}
    }else if(server){ver=server.version;base=null;data=defaultDB();dirty=true;}
    else{ // offline start from cache
      ver=st.ver||0;base=st.base||null;data=cache?JSON.parse(cache):defaultDB();dirty=!!st.dirty;setStatus('offline');
    }
    last=JSON.stringify(data);ls.set(ck('cache'),last);ls.set(KEY,last);persist();
    clearInterval(poll);poll=setInterval(check,Number(window.OQ_POLL_MS||20000));
    if(dirty){setStatus('saving');schedule(500);}else if(server)setStatus('ok');
    return data;
  }
  function changed(db){
    if(!school)return;const s=JSON.stringify(db);if(s===last)return;
    last=s;ls.set(ck('cache'),s);dirty=s!==base;persist();
    if(dirty){setStatus('saving');schedule(1500);}
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty&&school&&!inflight&&last&&last.length<60000){
    api('PUT','/api/db',{version:ver,data:JSON.parse(last)},true).then(r=>{ver=r.version;base=last;dirty=false;persist();}).catch(()=>{});}
    else if(document.visibilityState==='visible')check();});
  window.addEventListener('online',()=>check());
  async function logoutSchool(){
    if(dirty&&!confirm(_t('كاينين تغييرات مازال ما تسجلوش فالسيرفر. واش متأكد بغيتي تخرج؟')))return;
    try{await api('POST','/api/logout',{});}catch(e){}
    if(school&&!dirty){ls.del(ck('cache'));ls.del(ck('state'));ls.del(KEY);}
    try{sessionStorage.removeItem('ae_user');localStorage.removeItem('ae_user');}catch(e){}
    ls.del('oq_last_school');location.reload();
  }
  return {api:api,start:start,changed:changed,push:push,pull:pull,merge3:merge3,logoutSchool:logoutSchool,
    bind:f=>{setter=f;return ()=>{setter=null;};},sub:f=>{subs.push(f);return ()=>{subs=subs.filter(x=>x!==f);};},
    get status(){return status;},get version(){return ver;},get school(){return school;},get dirty(){return dirty;}};
})();

  const legacyData=sch=>{ // old browser-only data (from before the server) that is not owned by any school
    try{const own=localStorage.getItem('oq_owner');if(own&&own!==String(sch.id))return null;
      const o=JSON.parse(localStorage.getItem(KEY)||'null');if(!o||!Array.isArray(o.candidates))return null;
      const n=o.candidates.length+(o.sessions||[]).length+(o.monitors||[]).length+(o.payments||[]).length;return n>0?o:null;}catch(e){return null;}
  };
  const enter=async(sch)=>{
    const r=await OQ.api('GET','/api/db');
    if(!r.data){const lg=legacyData(sch);if(lg){setSchool(sch);setServer(r);setLegacy(lg);setPhase('import');return;}}
    OQ.start(sch,r);setSchool(sch);setPhase('app');
  };
  useEffect(()=>{(async()=>{
    try{const me=await OQ.api('GET','/api/me');await enter(me.school);}
    catch(e){
      let last=null;try{last=JSON.parse(localStorage.getItem('oq_last_school'));}catch(x){}
      if(!e.status&&last&&localStorage.getItem('oq_cache_'+last.id)){OQ.start(last,null);setSchool(last);setPhase('app');return;}
      setPhase('login');
    }
  })();},[]);
  const go=async()=>{
    if(busy)return;setErr('');setBusy(true);
    try{const r=await OQ.api('POST','/api/login',{school:code.trim(),password:pw});setPw('');await enter(r.school);}
    catch(e){setErr(e.status===401?_t('كود المدرسة ولا كلمة السر غالطين'):
      e.status===403?_t('هاد الحساب موقوف، تواصل معانا'):
      e.status===429?_t('بزاف ديال المحاولات، عاود من بعد شوية'):
      _t('ما قدرناش نتواصلو مع السيرفر'));}
    finally{setBusy(false);}
  };
  const doImport=async up=>{
    setBusy(true);setErr('');
    try{
      if(up){const data=Object.assign(defaultDB(),legacy);const r=await OQ.api('PUT','/api/db',{version:server.version,data:data,reason:'import'});
        OQ.start(school,{version:r.version,data:data});}
      else{try{localStorage.removeItem(KEY);}catch(e){}OQ.start(school,server);}
      setPhase('app');
    }catch(e){setErr(_t('ما قدرناش نرفعو الداتا، عاود جرب')+' ('+e.message+')');}
    finally{setBusy(false);}
  };
  if(phase==='app')return <React.Fragment><App key={school.id}/><SyncBadge/></React.Fragment>;
  if(phase==='check')return <div className="login"><div className="card" style={{textAlign:'center'}}><div className="lk"><Wordmark teal h={56}/></div><div style={{color:'var(--m)'}}>{_t('كنحملو…')}</div></div></div>;
  const LangSel=<div style={{textAlign:'end',marginBottom:6}}><select className="lg" value={lang} onChange={e=>setLang(e.target.value)}><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div>;
  if(phase==='import')return <div className="login"><div className="card">
    {LangSel}<div className="lk"><Wordmark teal h={56}/><div className="tag">{school.name}</div></div>
    <div className="al" style={{marginBottom:12}}>{_t('لقينا داتا قديمة محفوظة فهاد الجهاز')}: {legacy.candidates.length} {_t('مترشح')}{_t('،')} {(legacy.sessions||[]).length} {_t('حصة')}. {_t('بغيتي ترفعها لحساب المدرسة فالسيرفر؟')}</div>
    {err&&<div className="al bad">{err}</div>}
    <button type="button" className="b pri" style={{width:'100%',marginBottom:8}} disabled={busy} onClick={()=>doImport(true)}>{_t('⬆ رفع الداتا للسيرفر')}</button>
    <button type="button" className="b" style={{width:'100%'}} disabled={busy} onClick={()=>{if(confirm(_t('الداتا القديمة غادي تتمسح من هاد الجهاز. كمل؟')))doImport(false);}}>{_t('بداية جديدة بلا الداتا القديمة')}</button>
  </div></div>;
  return <div className="login"><div className="card" onKeyDown={e=>{if(e.key==='Enter')go();}}>
    {LangSel}
    <div className="lk"><Wordmark teal h={56}/><div className="tag">{_t('دخول حساب المدرسة')}</div></div>
    <F l={_t('كود المدرسة ولا رقم الترخيص')}><input value={code} dir="ltr" autoCapitalize="none" autoCorrect="off" spellCheck="false" onChange={e=>setCode(e.target.value)} autoFocus={!code}/></F>
    <F l={_t('كلمة السر ديال المدرسة')}><input type="password" dir="ltr" autoCapitalize="none" autoCorrect="off" value={pw} onChange={e=>setPw(e.target.value)} autoFocus={!!code}/></F>
    {err&&<div className="al bad">{err}</div>}
    <button type="button" className="b pri" style={{width:'100%'}} disabled={busy} onClick={go}>{busy?_t('…'):_t('دخول')}</button>
  </div></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><SchoolGate/></Boundary>);

</script>
</body>
</html>
